# Multi-profile distributed stack for Real-Time Security Event & Privacy-Preserving Analytics Platform.
# Profiles: core, analytics, observability, full. All container images strictly pinned by version tag.

services:
  secops-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.standalone
    profiles: ["core", "full"]
    ports:
      - "8080:8080"
    env_file:
      - .env.example
    environment:
      SECOPS_RUNTIME_MODE: "distributed"
      SECOPS_OPA_URL: "http://opa:8181/v1/data/secops/abac"
      SECOPS_API_HOST: "0.0.0.0"
      SECOPS_API_PORT: "8080"
    depends_on:
      opa:
        condition: service_started
      openbao:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - secops_data:/app/.local_data

  kafka:
    image: apache/kafka:4.3.2
    profiles: ["core", "full"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  apicurio-registry:
    image: apicurio/apicurio-registry:3.3.5
    profiles: ["core", "full"]
    ports:
      - "8081:8080"
    environment:
      QUARKUS_HTTP_PORT: "8080"

  opa:
    image: openpolicyagent/opa:1.22.3
    profiles: ["core", "full"]
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies/security_abac.rego"
    volumes:
      - ./infra/opa:/policies:ro

  openbao:
    image: openbao/openbao:2.7.3
    profiles: ["core", "full"]
    ports:
      - "8200:8200"
    command: ["server", "-config=/openbao/config/config.hcl"]
    volumes:
      - ./infra/openbao:/openbao/config:ro
      - openbao_data:/openbao/file

  postgres:
    image: imresamu/postgis:17-3.6.1-alpine3.23
    profiles: ["core", "analytics", "full"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secops_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-secops_catalog}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rustfs:
    image: rustfs/rustfs:1.0.6
    profiles: ["core", "analytics", "full"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-secopsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-secopsdevsecret}
    volumes:
      - rustfs_data:/data

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.15.1
    profiles: ["core", "analytics", "full"]
    ports:
      - "8182:8181"
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ: "postgresql://secops:secops_dev_only@postgres:5432/secops_catalog"
      LAKEKEEPER__PG_DATABASE_URL_WRITE: "postgresql://secops:secops_dev_only@postgres:5432/secops_catalog"
    depends_on:
      - postgres
      - rustfs

  flink-jobmanager:
    image: flink:2.1.3-scala_2.12-java17
    profiles: ["analytics", "full"]
    ports:
      - "8082:8081"
    command: ["jobmanager"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.backend.type: rocksdb
        execution.checkpointing.interval: 30000
    volumes:
      - ./processing/flink:/opt/flink/usrlib:ro

  flink-taskmanager:
    image: flink:2.1.3-scala_2.12-java17
    profiles: ["analytics", "full"]
    depends_on:
      - flink-jobmanager
    command: ["taskmanager"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - ./processing/flink:/opt/flink/usrlib:ro

  spark:
    image: apache/spark:4.1.4-scala2.13-java17-python3-ubuntu
    profiles: ["analytics", "full"]
    command: ["sleep", "infinity"]
    volumes:
      - ./processing/spark:/opt/spark/work-dir/jobs:ro

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    profiles: ["analytics", "full"]
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  airflow:
    image: apache/airflow:slim-3.4.0-python3.12
    profiles: ["analytics", "full"]
    ports:
      - "8083:8080"
    command: ["standalone"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    volumes:
      - ./processing/airflow/dags:/opt/airflow/dags:ro

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["observability", "full"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:13.0.14
    profiles: ["observability", "full"]
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana_dashboard.json:/var/lib/grafana/dashboards/secops.json:ro

  loki:
    image: grafana/loki:3.6.22
    profiles: ["observability", "full"]
    ports:
      - "3100:3100"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.166.0-${OTEL_ARCH:-arm64}
    profiles: ["observability", "full"]
    ports:
      - "4317:4317"
      - "4318:4318"

  marquez:
    image: marquezproject/marquez:0.51.1
    platform: linux/amd64
    profiles: ["observability", "full"]
    ports:
      - "5000:5000"
      - "5001:5001"
    depends_on:
      - postgres

volumes:
  secops_data:
  kafka_data:
  openbao_data:
  postgres_data:
  rustfs_data:
  opensearch_data:
  grafana_data:
