apiVersion: apps/v1
kind: Deployment
metadata:
  name: secops-control-plane
  namespace: secops-privacy-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secops-control-plane
  template:
    metadata:
      labels:
        app: secops-control-plane
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secops-api
          image: ghcr.io/ankdeshm/security-event-privacy-analytics:1.0.0
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SECOPS_RUNTIME_MODE
              value: "distributed"
            - name: SECOPS_OPA_URL
              value: "http://127.0.0.1:8181/v1/data/secops/abac"
            - name: SECOPS_HMAC_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: secops-openbao-secrets
                  key: hmac_master_key
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
        - name: opa-sidecar
          image: openpolicyagent/opa:1.22.3
          args:
            - "run"
            - "--server"
            - "--addr=127.0.0.1:8181"
            - "/policies/security_abac.rego"
          ports:
            - containerPort: 8181
              name: opa
          volumeMounts:
            - name: opa-policies
              mountPath: /policies
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: opa-policies
          configMap:
            name: secops-opa-policies
---
apiVersion: v1
kind: Service
metadata:
  name: secops-control-plane
  namespace: secops-privacy-platform
spec:
  selector:
    app: secops-control-plane
  ports:
    - port: 8080
      targetPort: 8080
      name: http
